<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 16px; font: 17px/1.35 -apple-system, BlinkMacSystemFont, system-ui, sans-serif; text-align: center; background: #f2f2f7; color: #000; }
      h1 { font-size: 28px; margin: 0 0 8px; }
      button { font: inherit; font-weight: 600; color: #fff; background: #007aff; border: 0; border-radius: 22px; min-height: 44px; padding: 0 20px; }
      @media (prefers-color-scheme: dark) { body { background: #000; color: #fff; } button { background: #0a84ff; } }
    </style>
  </head>
  <body>
    <div>
      <h1>You're offline</h1>
      <p>Check-in and attendance need a connection. Reconnect, then try again.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
